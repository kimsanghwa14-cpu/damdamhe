name: Capture websites
on:
  workflow_dispatch:
    inputs:
      publish_captures:
        description: 'Commit successful captures and status to the default branch (false = test only)'
        type: boolean
        default: false
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 07:00 = 전날 UTC 22:00
    - cron: '0 22 * * *'
permissions:
  contents: write
concurrency:
  group: website-captures-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture websites with per-site diagnostics
        id: capture
        run: npm run capture
      - name: Download Finviz charts and assemble daily scans
        if: ${{ !cancelled() }}
        run: npm run capture:finviz
      - name: Upload capture diagnostics and available screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capture-results/
            public/captures/
            public/finviz/
            finviz-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit captures and capture status when changed
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish_captures == true)
        shell: bash
        run: |
          git add public/captures public/finviz
          if git diff --cached --quiet; then
            echo "No capture changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update website captures"
          git push origin HEAD:${{ github.event.repository.default_branch }}
