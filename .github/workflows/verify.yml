name: Verify application
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/captures/**'
      - 'public/finviz/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/quote.test.mjs
      - run: npm run build
